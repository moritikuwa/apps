<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d16">
<meta name="description" content="Claudeを使いこなす技を星座にして、いま自分に何が抜けているか・次に何をすれば最短で進むかを見える形にするアプリ。">
<title>AI星座 — いま自分に何が抜けているかが、星で見える</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.svg">
<link rel="apple-touch-icon" href="assets/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

<header class="appbar">
  <div class="appbar-in">
    <div class="logo">AI星<span>座</span></div>
    <div id="hud-lv">Lv.1</div>
    <div class="hudwrap">
      <span id="hud-rank">星を見上げる者</span>
      <span class="hudbar"><i id="hud-bar" style="width:0"></i></span>
    </div>
    <div id="hud-pct">0%</div>
  </div>
</header>

<main id="app" class="main"></main>

<div id="sheet-host"></div>

<nav class="tabbar">
  <div class="tabbar-in" id="tabbar">
    <button data-view="map"><span class="i">🌌</span>星図</button>
    <button data-view="next"><span class="i">⚡</span>次の一手</button>
    <button data-view="status"><span class="i">📊</span>ステータス</button>
    <button data-view="settings"><span class="i">⚙️</span>設定</button>
  </div>
</nav>

<script src="assets/skills.js"></script>
<script src="assets/store.js"></script>
<script src="assets/calc.js"></script>
<script src="assets/map.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
