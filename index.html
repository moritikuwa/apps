<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171d">
<title>apps — 自作アプリ置き場</title>
<style>
  :root { --bg:#14171d; --card:#212733; --line:rgba(255,255,255,.09); --text:#e9edf3; --muted:#9aa5b5; --dim:#6f7c8f; --amber:#e0b341; }
  * { box-sizing: border-box; }
  body {
    margin:0; padding:32px 16px 60px; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
    line-height:1.75; font-size:15px; -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:620px; margin:0 auto; }
  h1 { font-size:20px; letter-spacing:.04em; margin:0 0 4px; }
  .lead { color:var(--muted); font-size:13.5px; margin:0 0 26px; }
  a.app {
    display:flex; gap:14px; align-items:center; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px; margin:12px 0;
  }
  a.app:hover { border-color:var(--amber); }
  .em { font-size:30px; flex:none; }
  .nm { display:block; font-size:16px; font-weight:700; }
  .ds { display:block; font-size:13px; color:var(--muted); }
  .go { margin-left:auto; color:var(--dim); font-size:20px; }
  footer { color:var(--dim); font-size:11.5px; margin-top:32px; line-height:1.8; }
</style>
</head>
<body>
<div class="wrap">
  <h1>apps</h1>
  <p class="lead">ブラウザだけで動く、自作の小さな道具。<br>
    入力したデータはこの端末の中だけに保存され、どこにも送信されません。</p>

  <a class="app" href="yoilog/">
    <span class="em">🍺</span>
    <span>
      <span class="nm">酔いログ</span>
      <span class="ds">毎日の晩酌と、翌朝のからだ・眠りを記録して突き合わせる</span>
    </span>
    <span class="go">›</span>
  </a>

  <footer>
    スマホでは、ブラウザの「ホーム画面に追加」を選ぶとアプリのように起動し、圏外でも使えます。<br>
    ここで公開しているのはプログラムだけです。記録した中身は公開されません。
  </footer>
</div>
</body>
</html>
