<style>
/* ============================================================
   いっこまえ / IKKOMAE   見た目
   小学校低学年が 一人で さわれること を いちばんに。
   ・押せる ところは 大きく（さいてい 56px）
   ・文字は 大きく、行は ゆったり
   ・一つの 画面で 聞くことは 一つだけ
   ============================================================ */
:root {
  --bg:#131a26;
  --bg2:#0e141e;
  --card:#1d2634;
  --card2:#26324a;
  --line:rgba(255,255,255,.10);
  --text:#eef3f9;
  --muted:#9dabbd;
  --dim:#6d7d92;
  --gold:#ffd35e;
  --kid:#5ecfb0;
  --adult:#f2a253;
  --bar:54px;
  --tab:64px;
}

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  line-height:1.8; font-size:16px; -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button { font:inherit; color:inherit; }

/* ── 上のバー ── */
.appbar {
  position:fixed; top:0; left:0; right:0; z-index:40;
  height:calc(var(--bar) + env(safe-area-inset-top)); padding-top:env(safe-area-inset-top);
  background:linear-gradient(180deg,#182031 0%,rgba(24,32,49,.93) 100%);
  border-bottom:1px solid var(--line); backdrop-filter:blur(8px);
}
.appbar-in { display:flex; align-items:center; gap:10px; height:var(--bar); padding:0 14px; max-width:720px; margin:0 auto; }
.logo { font-weight:800; letter-spacing:.08em; font-size:16px; }
.logo b { color:var(--gold); }
.spacer { flex:1; }
#hud-fire { font-size:14px; font-weight:700; color:var(--gold); font-variant-numeric:tabular-nums; }
#hud-fire.off { color:var(--dim); filter:grayscale(1); }
.iconbtn {
  width:40px; height:40px; border-radius:11px; border:1px solid var(--line);
  background:var(--card); font-size:17px; cursor:pointer; flex:none;
}

/* ── 本体 ── */
.main { max-width:720px; margin:0 auto; padding:calc(var(--bar) + env(safe-area-inset-top) + 16px) 16px calc(var(--tab) + env(safe-area-inset-bottom) + 28px); }
body.noTab .main { padding-bottom:calc(env(safe-area-inset-bottom) + 28px); }

/* ── 下のタブ ── */
.tabbar {
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  height:calc(var(--tab) + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom);
  background:rgba(16,22,33,.96); border-top:1px solid var(--line); backdrop-filter:blur(8px);
}
body.noTab .tabbar { display:none; }
.tabbar-in { display:flex; height:var(--tab); max-width:720px; margin:0 auto; }
.tabbar-in button {
  flex:1; background:none; border:0; cursor:pointer; color:var(--dim);
  font-size:11.5px; font-weight:700; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
}
.tabbar-in button .i { font-size:21px; line-height:1; }
.tabbar-in button.on { color:var(--gold); }

/* ── 共通のふだ ── */
.panel { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin:0 0 14px; }
.h { font-size:13px; font-weight:800; color:var(--muted); letter-spacing:.06em; margin:0 0 10px; }
.sub { font-size:13.5px; color:var(--muted); line-height:1.75; margin:0; }
.center { text-align:center; }

/* ── おおきなボタン ── */
.big {
  display:block; width:100%; min-height:62px; border-radius:16px; border:0; cursor:pointer;
  background:linear-gradient(180deg,#ffe08a,#f0bd42); color:#221a05;
  font-size:19px; font-weight:800; letter-spacing:.04em; margin:14px 0 0;
  box-shadow:0 6px 0 #a8801f; transition:transform .06s, box-shadow .06s;
}
.big:active { transform:translateY(4px); box-shadow:0 2px 0 #a8801f; }
.big.ghost { background:var(--card2); color:var(--text); box-shadow:0 6px 0 #141b27; }
.big.ghost:active { box-shadow:0 2px 0 #141b27; }
.big[disabled] { opacity:.4; box-shadow:none; cursor:default; transform:none; }
.mini {
  min-height:44px; padding:0 16px; border-radius:11px; border:1px solid var(--line);
  background:var(--card2); cursor:pointer; font-size:14px; font-weight:700;
}
.row { display:flex; gap:10px; flex-wrap:wrap; }
.row > .mini { flex:1; min-width:130px; }

/* ── きょうの おだい ── */
.theme {
  background:linear-gradient(160deg,#243049,#1a2233);
  border:1px solid var(--line); border-radius:20px; padding:22px 18px; text-align:center;
}
.theme .tag { display:inline-block; font-size:11.5px; font-weight:800; padding:3px 12px; border-radius:99px; background:rgba(255,255,255,.09); letter-spacing:.06em; }
.theme .em { font-size:52px; line-height:1.2; margin:8px 0 2px; }
.theme .lab { font-size:12px; color:var(--gold); font-weight:800; letter-spacing:.12em; margin-bottom:4px; }
.theme .goal { font-size:21px; font-weight:800; line-height:1.6; }

/* ── みち（はしご） ── */
.road { margin:6px 0 0; }
.rung {
  position:relative; background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:13px 14px 13px 46px; margin:0 0 8px; font-size:15.5px; line-height:1.6;
}
.rung .n {
  position:absolute; left:12px; top:12px; width:24px; height:24px; border-radius:50%;
  background:var(--card2); color:var(--muted); font-size:12px; font-weight:800;
  display:flex; align-items:center; justify-content:center;
}
.rung.goal { background:linear-gradient(180deg,#33406040,#1d2634); border-color:rgba(255,211,94,.45); padding-left:46px; }
.rung.goal .n { background:var(--gold); color:#221a05; }
.rung.blank { border-style:dashed; color:var(--dim); font-size:14px; padding-top:10px; padding-bottom:10px; }
.rung.blank .n { top:9px; }
.rung .sz { float:right; color:var(--dim); font-size:11px; letter-spacing:.14em; margin-left:8px; }
.arrow { text-align:center; color:var(--dim); font-size:16px; line-height:1; margin:-2px 0 6px; }

/* ── といかけ ── */
.ask {
  text-align:center; font-size:24px; font-weight:800; letter-spacing:.02em;
  margin:20px 0 4px; line-height:1.5;
}
.ask small { display:block; font-size:13px; font-weight:700; color:var(--muted); letter-spacing:.06em; margin-top:4px; }
.count { text-align:center; font-size:12px; font-weight:800; color:var(--gold); letter-spacing:.14em; font-variant-numeric:tabular-nums; }

/* ── てふだ ── */
.hand { display:grid; grid-template-columns:1fr; gap:10px; margin:14px 0 0; }
@media (min-width:520px) { .hand { grid-template-columns:1fr 1fr; } }
.pick {
  text-align:left; width:100%; min-height:60px; padding:14px 16px; cursor:pointer;
  background:var(--card); border:1.5px solid var(--line); border-radius:14px;
  font-size:16px; line-height:1.6; font-weight:600;
  transition:transform .07s, border-color .12s, background .12s;
}
.pick:active { transform:scale(.97); }
.pick:hover { border-color:var(--gold); }
.pick.chosen { border-color:var(--gold); background:#2c3549; }

/* ── ばんの わたし ── */
.handoff { text-align:center; padding:34px 12px 8px; }
.handoff .em { font-size:64px; }
.handoff .who { font-size:26px; font-weight:800; margin:8px 0 2px; }
.handoff .note { color:var(--muted); font-size:14px; }

/* ── みくらべ ── */
.compare { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; align-items:stretch; }
.compare.one { grid-template-columns:1fr; }
.cname { font-size:13px; font-weight:800; text-align:center; padding:6px 0; border-radius:10px; }
.cname.kid { background:rgba(94,207,176,.16); color:var(--kid); }
.cname.adult { background:rgba(242,162,83,.16); color:var(--adult); }
.crung {
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:10px 11px; font-size:14px; line-height:1.65;
}
.crung .sz { display:block; color:var(--dim); font-size:10.5px; letter-spacing:.16em; margin-bottom:2px; }
.crung.same { border-color:var(--gold); background:#2a3247; }
.samemark { text-align:center; font-size:11.5px; color:var(--gold); font-weight:800; margin:-3px 0 8px; }
.shape { background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-top:14px; }
.shape .t { font-size:16px; font-weight:800; margin-bottom:4px; }
.shape .b { font-size:13.5px; color:var(--muted); line-height:1.8; }
.shape .m { font-size:26px; float:right; margin-left:10px; }

/* ── やくそく ── */
.promise { background:linear-gradient(160deg,#2b3550,#1c2434); border:1px solid rgba(255,211,94,.35); border-radius:16px; padding:18px; text-align:center; }
.promise .lab { font-size:12px; font-weight:800; color:var(--gold); letter-spacing:.12em; }
.promise .t { font-size:19px; font-weight:800; line-height:1.6; margin:8px 0 2px; }
.promise .by { font-size:12.5px; color:var(--muted); }

/* ── きろく ── */
.logitem { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin:0 0 10px; }
.logitem .top { display:flex; align-items:center; gap:10px; }
.logitem .em { font-size:26px; }
.logitem .g { font-weight:800; font-size:15px; line-height:1.5; flex:1; }
.logitem .d { font-size:11.5px; color:var(--dim); font-variant-numeric:tabular-nums; }
.logitem .todo { margin-top:10px; padding:10px 12px; border-radius:11px; background:var(--card2); font-size:13.5px; }
.logitem .todo.ok { background:rgba(94,207,176,.14); color:var(--kid); }
.stats { display:flex; gap:10px; }
.stat { flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 10px; text-align:center; }
.stat b { display:block; font-size:26px; font-weight:800; color:var(--gold); line-height:1.3; font-variant-numeric:tabular-nums; }
.stat span { font-size:11.5px; color:var(--muted); }

/* ── せってい ── */
.field { display:flex; align-items:center; gap:10px; margin:0 0 10px; }
.field label { flex:none; width:70px; font-size:13.5px; color:var(--muted); font-weight:700; }
.field input {
  flex:1; min-width:0; height:48px; padding:0 14px; border-radius:11px;
  border:1px solid var(--line); background:var(--bg2); color:var(--text); font-size:16px;
}
.seg { display:flex; gap:8px; }
.seg button { flex:1; min-height:52px; border-radius:12px; border:1.5px solid var(--line); background:var(--card2); cursor:pointer; font-size:15px; font-weight:700; }
.seg button.on { border-color:var(--gold); background:#2f3a52; color:var(--gold); }
textarea.io {
  width:100%; height:130px; padding:12px; border-radius:12px; border:1px solid var(--line);
  background:var(--bg2); color:var(--text); font-size:12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; line-height:1.6;
}
.danger { color:#ff9a8a; border-color:rgba(255,154,138,.4); }

/* ── しあげ ── */
.finish { text-align:center; padding:26px 10px 4px; }
.finish .em { font-size:66px; animation:pop .5s ease-out; }
.finish .t { font-size:24px; font-weight:800; margin:6px 0; }
@keyframes pop { 0%{transform:scale(.5);opacity:0} 60%{transform:scale(1.12)} 100%{transform:scale(1);opacity:1} }
@media (prefers-reduced-motion:reduce) { .finish .em { animation:none } }

/* ── しらせ ── */
.toast {
  position:fixed; left:50%; bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 18px);
  transform:translate(-50%,14px); opacity:0; transition:.25s; z-index:80;
  background:#2b3550; border:1px solid var(--line); border-radius:12px;
  padding:11px 18px; font-size:14px; font-weight:700; max-width:88vw; text-align:center;
}
.toast.go { transform:translate(-50%,0); opacity:1; }

</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

  <div class="appbar-in">
    <div class="logo">いっこ<b>まえ</b></div>
    <div class="spacer"></div>
    <div id="hud-fire" class="off">🔥<b>0</b></div>

<main id="app" class="main"></main>

<script>
/* ============================================================
   いっこまえ / IKKOMAE   おだいのデータ
   ------------------------------------------------------------
   ゴールを一つ決めて、そこから「いっこまえは？」を3回くだる。
   カードは3つの高さに分けてある。

     s:3  ゴールの すぐ手前。もう ほとんど できている状態
     s:2  とちゅう。まだ先は あるけれど、半分は 進んだ状態

   正解は決めない。どのカードを選んでも道になる。
   高さを混ぜて配ることで「いま これを えらぶと 大きすぎないか」を
   自分で はかる練習になる。ここがこのアプリの芯。

   文字は小学校低学年が一人で読める量にする。
   ひらがな中心、漢字は1〜2年で習うものまで。
   ============================================================ */
(function (root) {
  'use strict';

  var IK = root.IK || (root.IK = {});

    /* ── くらし ───────────────────────────────── */

        { t: 'ふくを たたんで 引き出しに 入れた', s: 2 },
        { t: 'ゆかの ものを ぜんぶ ベッドの 上に あつめた', s: 2 },
        { t: 'タイマーを 5分 かけた', s: 1 },
        { t: 'ごみぶくろを 一まい ひろげた', s: 1 },
        { t: 'どこから やるか 一つ きめた', s: 1 },
        { t: 'まず ゆかの ものだけ ひろうと きめた', s: 1 }
      ]
    },
    {
      id: 'asita', emoji: '🎒', tag: 'くらし',
      goal: 'あしたの がっこうの じゅんびが おわった',
      cards: [
        { t: 'ランドセルを げんかんに おいた', s: 3 },
        { t: 'あした きる ふくを いすに かけた', s: 3 },
        { t: 'すいとうを つめて れいぞうこに 入れた', s: 3 },

        { t: '体そう ふくが せんたく できているか 見た', s: 2 },
        { t: 'れんらくちょうを ひらいた', s: 1 },
        { t: 'あしたが 何よう日か たしかめた', s: 1 },

      ]
    },
    {
      id: 'curry', emoji: '🍛', tag: 'つくる',

      cards: [
        { t: 'おさらに ごはんと カレーを もった', s: 3 },
        { t: 'ルーを 入れて 10分 にこんだ', s: 3 },
        { t: 'にんじんが やわらかく なった', s: 3 },

      ]
    },
    {
      id: 'ofuro', emoji: '🛁', tag: 'くらし',
      goal: 'おふろから 出て ねる じゅんびが できた',
      cards: [
        { t: 'かみを かわかして パジャマを きた', s: 3 },

<script>
/* ============================================================
   いっこまえ / IKKOMAE   きろくの ほぞん
   すべて この端末の localStorage に保存します。外には一切送りません。
   ============================================================ */
(function (root) {
  'use strict';

  var IK = root.IK || (root.IK = {});
  var KEY = 'ikkomae.v1';

  var defaults = {
    names: { kid: 'こども', adult: 'おとな' },
    mode: 2,                 // 1 = ひとりでやる / 2 = ふたりでやる
    runs: [],                // 新しい順。{ at, theme, goal, emoji, roads[], todo, done, doneAt }
    seen: {},                // themeId -> やった回数。おなじお題ばかり出さないため
    streak: { days: 0, best: 0, last: '' },   // 「やった」を記録した日の連続
    counts: { runs: 0, dones: 0 },
    ui: { seenIntro: false }
  };

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function today() {
    var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  /* 'YYYY-MM-DD' 同士の日数の差 */
  function dayDiff(a, b) {
    var pa = a.split('-'), pb = b.split('-');
    return Math.round((Date.UTC(+pb[0], +pb[1] - 1, +pb[2]) - Date.UTC(+pa[0], +pa[1] - 1, +pa[2])) / 86400000);
  }

  /* 日づけを 数に する。おだいを 日がわりで えらぶのに つかう */
  function daySeed(d) {
    var p = (d || today()).split('-');
    return (+p[0]) * 372 + (+p[1]) * 31 + (+p[2]);
  }

  var Store = IK.store = {
    data: clone(defaults),

    load: function () {
      try {
        var raw = root.localStorage && root.localStorage.getItem(KEY);
        if (raw) {
          var p = JSON.parse(raw) || {};
          this.data = {
            names: Object.assign(clone(defaults.names), p.names || {}),
            mode: p.mode === 1 ? 1 : 2,
            runs: p.runs || [],
            seen: p.seen || {},
            streak: Object.assign(clone(defaults.streak), p.streak || {}),
            counts: Object.assign(clone(defaults.counts), p.counts || {}),
            ui: Object.assign(clone(defaults.ui), p.ui || {})
          };
        }
      } catch (e) { /* こわれていたら はじめから */ }
      return this.data;
    },

    save: function () {
      try { root.localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) {}
    },

    /* ── なまえ・にんずう ── */
    setName: function (who, name) {
      name = String(name || '').trim().slice(0, 8);
      if (!name) return;
      this.data.names[who] = name;
      this.save();
    },
    setMode: function (n) { this.data.mode = (n === 1 ? 1 : 2); this.save(); },
    nameOf: function (who) { return this.data.names[who] || (who === 'kid' ? 'こども' : 'おとな'); },

    /* ── みちを 1本 記録する ──
       roads は [{ who, name, steps:[{id,t,s}, x3] }] */
    addRun: function (theme, roads) {
      var rec = {
        at: today(),
        theme: theme.id,
        goal: theme.goal,
        emoji: theme.emoji,
        roads: roads.map(function (r) {
          return {
            who: r.who,
            name: r.name,
            steps: r.steps.map(function (c) { return { id: c.id, t: c.t, s: c.s }; })
          };
        }),
        todo: null,
        done: false,
        doneAt: ''
      };
      this.data.runs.unshift(rec);
      if (this.data.runs.length > 300) this.data.runs.length = 300;
      this.data.seen[theme.id] = (this.data.seen[theme.id] || 0) + 1;
      this.data.counts.runs++;
      this.save();
      return rec;
    },

    /* ── きょうやる 一手を きめる ── */
    setTodo: function (rec, card, who) {
      rec.todo = { id: card.id, t: card.t, s: card.s, who: who };
      rec.done = false;
      rec.doneAt = '';
      this.save();
    },

    /* まだ「やった？」を 聞いていない やくそく（新しい順に さがす） */
    pendingTodo: function () {
      var runs = this.data.runs;
      for (var i = 0; i < runs.length; i++) {
        if (runs[i].todo && !runs[i].done) return runs[i];
      }
      return null;
    },

    /* やった と 答えたとき。ここでだけ 火が のびる */
    markDone: function (rec, ok) {
      if (!rec || !rec.todo) return;
      if (!ok) {                       /* まだ、なら やくそくを といて 次に すすむ */
        rec.todo = null;
        this.save();
        return;
      }
      rec.done = true;
      rec.doneAt = today();
      this.data.counts.dones++;
      this.touchStreak();
      this.save();
    },

    /* ── 火（つづいた日数） ──
       のびるのは「やった」と 答えた日だけ。道を 作っただけでは のびない。
       1日の ぬけは ゆるす。1日 できなかっただけで 全部 消えるのは、つづける敵なので。 */
    touchStreak: function () {
      var t = today(), s = this.data.streak;
      if (s.last === t) return s;
      var gap = s.last ? dayDiff(s.last, t) : 999;
      s.days = (gap <= 2) ? s.days + 1 : 1;
      s.last = t;
      if (s.days > s.best) s.best = s.days;
      this.save();
      return s;
    },
    streakAlive: function () {
      var s = this.data.streak;
      return s.last ? dayDiff(s.last, today()) <= 2 : false;
    },

    /* ── おだいを えらぶ ──
       まだ やっていない ものを 先に。ぜんぶ やったら 回数の 少ない ものから。
       おなじ日に 何度 ひらいても おなじ おだいが 出る（n を ずらすと 次のおだい）。 */
    pickTheme: function (n) {
      var seen = this.data.seen, list = IK.THEMES.slice();
      list.sort(function (a, b) {
        var d = (seen[a.id] || 0) - (seen[b.id] || 0);
        if (d) return d;
        return a.id < b.id ? -1 : 1;
      });
      var least = seen[list[0].id] || 0;
      var pool = list.filter(function (t) { return (seen[t.id] || 0) === least; });
      var i = (daySeed() + (n || 0)) % pool.length;
      return pool[i];
    },

    /* ── かきだし・よみこみ ── */
    exportText: function () {
      return JSON.stringify({ v: 1, savedAt: today(), data: this.data }, null, 2);
    },
    importText: function (text) {
      var p = JSON.parse(text), d = (p && p.data) ? p.data : p;
      if (!d || typeof d !== 'object' || !d.runs) throw new Error('かたちが ちがいます');
      this.data = {
        names: Object.assign(clone(defaults.names), d.names || {}),
        mode: d.mode === 1 ? 1 : 2,
        runs: d.runs || [],
        seen: d.seen || {},
        streak: Object.assign(clone(defaults.streak), d.streak || {}),
        counts: Object.assign(clone(defaults.counts), d.counts || {}),
        ui: Object.assign(clone(defaults.ui), d.ui || {})
      };
      this.save();
    },
    reset: function () { this.data = clone(defaults); this.save(); }
  };

  IK.today = today;
  IK.dayDiff = dayDiff;
  IK.daySeed = daySeed;

})(window);

</script>
<script>
/* ============================================================
   いっこまえ / IKKOMAE   1かいぶんの すすめ方
   ------------------------------------------------------------
   ゴールから 3回 くだる。1回ごとに カードを 6まい 配る。
   6まいには かならず 3つの 高さ（すぐ手前・とちゅう・いますぐ）を
   まぜて 入れる。ここを かたよらせると
   「いま これを えらぶと 大きすぎないか」を はかる練習に ならない。
   ============================================================ */
(function (root) {
  'use strict';

  var IK = root.IK || (root.IK = {});
  var STEPS = 3;              // 何回 「いっこまえは？」と 聞くか
  var HAND = 6;               // 1回に 配る まい数
  var PER_SIZE = 2;           // 高さごとに さいてい 何まい 出すか

  /* たねから おなじ ならびを 作る（開きなおしても 同じ手札が 出るように） */
  function rng(seed) {
    var s = (seed >>> 0) || 1;
    return function () {
      s ^= s << 13; s >>>= 0;
      s ^= s >> 17;
      s ^= s << 5; s >>>= 0;
      return s / 4294967296;
    };
  }

  function shuffled(arr, seed) {
    var a = arr.slice(), r = rng(seed);
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(r() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function hash(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = (h * 16777619) >>> 0; }
    return h >>> 0;
  }

  var Game = IK.game = {
    STEPS: STEPS,

    /* おだいと まわし番号から、そのおだい 用の たねを 作る */
    seedOf: function (theme, n) {
      return (IK.daySeed() * 131 + hash(theme.id) + (n || 0) * 7919) >>> 0;
    },

    /* 高さごとに ならべ直した ふだの 山。ふたりとも 同じ山から ひく */
    piles: function (theme, seed) {
      var p = { 1: [], 2: [], 3: [] };
      theme.cards.forEach(function (c) { p[c.s].push(c); });
      [1, 2, 3].forEach(function (s) { p[s] = shuffled(p[s], seed + s * 977); });
      return p;
    },

    /* step 回目（0..2）に 配る 6まい。
       used は その人が すでに つかった カードの id */
    deal: function (theme, seed, step, used) {
      var piles = this.piles(theme, seed), hand = [];
      var taken = {};
      [3, 2, 1].forEach(function (s) {
        var n = 0;
        piles[s].forEach(function (c) {
          if (n >= PER_SIZE) return;
          if (used.indexOf(c.id) >= 0 || taken[c.id]) return;
          hand.push(c); taken[c.id] = 1; n++;
        });
      });
      /* 高さが かたよって 6まいに とどかないときは 残りから 足す */
      if (hand.length < HAND) {
        [3, 2, 1].forEach(function (s) {
          piles[s].forEach(function (c) {
            if (hand.length >= HAND) return;
            if (used.indexOf(c.id) >= 0 || taken[c.id]) return;
            hand.push(c); taken[c.id] = 1;
          });
        });
      }
      /* 画面での ならびは 毎回 まぜる。高さの じゅんに ならんでいると 見た目で わかってしまう */
      return shuffled(hand, seed + step * 4093 + used.length * 17);
    },

    /* できた みちの かたちを 読む。○×は つけない。
       steps[0] が ゴールの いっこ前、steps[2] が いちばん下（きょうやる）。 */
    shape: function (steps) {
      var v = steps.map(function (c) { return c.s; });
      var allSame = v[0] === v[1] && v[1] === v[2];
      var down = v[0] >= v[1] && v[1] >= v[2];
      var strict = v[0] > v[1] && v[1] > v[2];

      if (strict) return {
        key: 'straight', mark: '🪜',
        title: 'きれいな はしごに なった',
        body: 'ゴールの すぐ手前 → とちゅう → いますぐ できること。大きい ところから 小さい ところへ、ちゃんと おりてきたね。'
      };
      if (allSame && v[0] === 3) return {
        key: 'allbig', mark: '🏔',
        title: 'ぜんぶ ゴールの すぐ手前だね',
        body: 'どれも もう ほとんど できている ところ。ここから 下に、もう ひとつ 小さく わけられないかな？'
      };
      if (allSame && v[0] === 1) return {
        key: 'allsmall', mark: '🐜',
        title: 'ぜんぶ いますぐ できる ことだね',
        body: 'すぐ 手が うごくのは つよい。この 3つで ゴールまで とどくか、上から もう一回 見てみよう。'
      };
      if (allSame) return {
        key: 'allmid', mark: '🌫',
        title: 'ぜんぶ とちゅうの ことだね',
        body: 'ゴールの すぐ手前と、いますぐ できることを さがすと、道が もっと はっきりするかも。'
      };
      if (down) return {
        key: 'down', mark: '↘️',
        title: 'だんだん 小さく なっていったね',
        body: '上から 下へ、ちゃんと 近づいてきている。おなじ 高さが つづいた ところは、もう一つ 分けられるかも。'
      };
      return {
        key: 'up', mark: '🔀',
        title: 'とちゅうで また 大きく なったね',
        body: '下に いくほど 小さく なるのが 「いっこまえ」。じゅんばんを 入れかえたら、どんな みちに なるかな？'
      };
    },

    /* ふたりの みちで、おなじ カードを えらんだ ところ */
    sameAt: function (a, b) {
      var out = [];
      for (var i = 0; i < STEPS; i++) {
        out.push(!!(a && b && a.steps[i] && b.steps[i] && a.steps[i].id === b.steps[i].id));
      }
      return out;
    },

    /* 「きょうやる」の こうほ。ふたりの みちの カードを 小さい じゅんに */
    todoCandidates: function (roads) {
      var seen = {}, out = [];
      roads.forEach(function (r) {
        r.steps.forEach(function (c, i) {
          if (seen[c.id]) return;
          seen[c.id] = 1;
          out.push({ id: c.id, t: c.t, s: c.s, who: r.who, bottom: i === STEPS - 1 });
        });
      });
      out.sort(function (x, y) {
        if (x.s !== y.s) return x.s - y.s;                 /* 小さい ものが 上 */
        return (y.bottom ? 1 : 0) - (x.bottom ? 1 : 0);    /* いちばん下だった ものを 先に */
      });
      return out;
    }
  };

})(window);

</script>
<script>
/* ============================================================
   いっこまえ / IKKOMAE   画面
   ------------------------------------------------------------
   すすみ方
     home ─→ handoff ─→ play(×3) ─→ handoff ─→ play(×3)
          ─→ compare ─→ todo ─→ finish ─→ home
   ひとりで やるときは handoff を とばして 1本だけ 作る。
   ============================================================ */
(function (root) {
  'use strict';

  var IK = root.IK;
  var store = IK.store, game = IK.game;
  var app, view = 'home';
  var run = null;          // いま やっている 1かいぶん
  var themeN = 0;          // 「べつの おだい」を おした 回数
  var hidePromise = false; // この せっしょんの あいだだけ やくそくを ふせる

  function $(id) { return document.getElementById(id); }
  function h(html) { var d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
    });
  }
  function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

  function toast(msg) {
    var t = h('<div class="toast">' + esc(msg) + '</div>');
    document.body.appendChild(t);
    setTimeout(function () { t.classList.add('go'); }, 10);
    setTimeout(function () { t.remove(); }, 2100);
  }

  function szMark(s) { return (IK.SIZE[s] || { mark: '' }).mark; }

  /* 何日前か */
  function agoText(at) {
    var d = IK.dayDiff(at, IK.today());
    if (d <= 0) return 'きょう';
    if (d === 1) return 'きのう';
    return d + '日まえ';
  }

  /* ============================================================
     上のバー
     ============================================================ */
  function renderHud() {
    var s = store.data.streak, alive = store.streakAlive();
    var f = $('hud-fire');
    f.innerHTML = '🔥<b>' + (alive ? s.days : 0) + '</b>';
    f.className = (alive && s.days > 0) ? '' : 'off';
    var q = $('hud-quit');
    q.style.display = (view === 'play' || view === 'handoff' || view === 'compare' || view === 'todo') ? '' : 'none';
  }

  function setView(v) {
    view = v;
    document.body.classList.toggle('noTab', v !== 'home' && v !== 'log' && v !== 'settings');
    Array.prototype.forEach.call(document.querySelectorAll('#tabbar button'), function (b) {
      b.classList.toggle('on', b.dataset.view === v);
    });
    render();
    root.scrollTo(0, 0);
  }

  /* ============================================================
     ホーム
     ============================================================ */
  function renderHome() {
    var out = [];

    if (!store.data.ui.seenIntro) {
      out.push(
        '<div class="panel">' +
        '<div class="h">はじめての人へ</div>' +
        '<p class="sub">「できるように なりたいこと」を <b>いちばん上</b> に おきます。<br>' +
        'そこから <b>「じゃあ、いっこまえは？」</b> を 3回 くりかえして、下へ おりていきます。<br>' +
        'いちばん下に のこったのが、<b>きょう やること</b> です。</p>' +
        '<button class="big ghost" id="intro-ok">わかった</button>' +
        '</div>'
      );
    }

    var pend = store.pendingTodo();
    if (pend && !hidePromise) {
      var old = IK.dayDiff(pend.at, IK.today()) >= 2;
      out.push(
        '<div class="promise">' +
        '<div class="lab">' + esc(agoText(pend.at)) + ' きめた やくそく</div>' +
        '<div class="t">' + esc(pend.todo.t) + '</div>' +
        '<div class="by">' + esc(store.nameOf(pend.todo.who)) + 'が えらんだ　／　ゴール：' + esc(pend.goal) + '</div>' +
        '<button class="big" id="pr-done">やった！</button>' +
        '<div class="row" style="margin-top:10px">' +
        '<button class="mini" id="pr-later">まだ</button>' +
        (old ? '<button class="mini danger" id="pr-drop">これは やめる</button>' : '') +
        '</div>' +
        '</div>'
      );
    }

    var th = store.pickTheme(themeN);
    var color = IK.TAGS[th.tag] || '#9dabbd';
    out.push(
      '<div class="theme" style="margin-top:' + (out.length ? '14px' : '0') + '">' +
      '<span class="tag" style="color:' + color + '">' + esc(th.tag) + '</span>' +
      '<div class="em">' + esc(th.emoji) + '</div>' +
      '<div class="lab">きょうの ゴール</div>' +
      '<div class="goal">' + esc(th.goal) + '</div>' +
      '</div>'
    );

    out.push(
      '<div class="panel" style="margin-top:14px">' +
      '<div class="h">だれで やる？</div>' +
      '<div class="seg">' +
      '<button data-mode="2" class="' + (store.data.mode === 2 ? 'on' : '') + '">ふたりで<br><span style="font-size:11.5px;font-weight:600;color:var(--muted)">' + esc(store.nameOf('kid')) + ' と ' + esc(store.nameOf('adult')) + '</span></button>' +
      '<button data-mode="1" class="' + (store.data.mode === 1 ? 'on' : '') + '">ひとりで</button>' +
      '</div>' +
      '<button class="big" id="go">はじめる</button>' +
      '<button class="mini" id="another" style="width:100%;margin-top:10px">べつの おだいに する</button>' +
      '</div>'
    );

    app.innerHTML = out.join('');

    if ($('intro-ok')) $('intro-ok').onclick = function () {
      store.data.ui.seenIntro = true; store.save(); render();
    };
    if ($('pr-done')) $('pr-done').onclick = function () {
      store.markDone(pend, true);
      buzz([10, 40, 20]);
      toast('🔥 ' + store.data.streak.days + '日 つづいてるよ');
      renderHud(); render();
    };
    if ($('pr-later')) $('pr-later').onclick = function () { hidePromise = true; render(); };
    if ($('pr-drop')) $('pr-drop').onclick = function () { store.markDone(pend, false); render(); };

    Array.prototype.forEach.call(app.querySelectorAll('[data-mode]'), function (b) {
      b.onclick = function () { store.setMode(+b.dataset.mode); render(); };
    });
    $('another').onclick = function () { themeN++; render(); };
    $('go').onclick = startRun;
  }

  /* ============================================================
     1かいの はじまり
     ============================================================ */
  function startRun() {
    var th = store.pickTheme(themeN);
    var roads = [{ who: 'kid', name: store.nameOf('kid'), steps: [] }];
    if (store.data.mode === 2) roads.push({ who: 'adult', name: store.nameOf('adult'), steps: [] });
    run = { theme: th, seed: game.seedOf(th, themeN), roads: roads, idx: 0, step: 0, todo: null, rec: null };
    setView(store.data.mode === 2 ? 'handoff' : 'play');
  }

  function quitRun() {
    run = null;
    hidePromise = false;
    setView('home');
  }

  /* ============================================================
     ばんの わたし
     ============================================================ */
  function renderHandoff() {
    var r = run.roads[run.idx];
    var first = run.idx === 0;
    app.innerHTML =
      '<div class="handoff">' +
      '<div class="em">' + (first ? '🚀' : '🤝') + '</div>' +
      (first ? '' : '<div class="note">できた！ みちは かくしたよ 🙈</div>') +
      '<div class="who">' + esc(r.name) + ' の ばん</div>' +
      '<div class="note">' + (first ? 'スマホを ' + esc(r.name) + ' に わたしてね' : 'つぎの人に わたしてね。<br>まえの人の こたえは 見えないよ') + '</div>' +
      '</div>' +
      '<div class="theme" style="margin-top:18px">' +
      '<div class="em">' + esc(run.theme.emoji) + '</div>' +
      '<div class="lab">ゴール</div>' +
      '<div class="goal">' + esc(run.theme.goal) + '</div>' +
      '</div>' +
      '<button class="big" id="hstart">はじめる</button>';
    $('hstart').onclick = function () { setView('play'); };
  }

  /* ============================================================
     えらぶ画面
     ============================================================ */
  /* えらんだ ところまでを はしごで 見せる。
     まだの ぶんで 画面を うめると カードが 下に おされて 見えなくなるので、
     のこりは 1行に まとめる。 */
  function roadHtml(steps) {
    var out = ['<div class="rung goal"><span class="n">⭐</span>' + esc(run.theme.goal) + '</div>'];
    steps.forEach(function (c, i) {
      out.push('<div class="arrow">↑</div>');
      out.push('<div class="rung"><span class="n">' + (i + 1) + '</span>' + esc(c.t) + '</div>');
    });
    var rest = game.STEPS - steps.length;
    if (rest > 0) {
      out.push('<div class="arrow">↑</div>');
      out.push('<div class="rung blank"><span class="n">' + (steps.length + 1) + '</span>いま えらんでいる ところ</div>');
    }
    return '<div class="road">' + out.join('') + '</div>';
  }

  function renderPlay() {
    var r = run.roads[run.idx];
    var used = r.steps.map(function (c) { return c.id; });
    var hand = game.deal(run.theme, run.seed, run.step, used);
    var last = r.steps.length ? r.steps[r.steps.length - 1].t : run.theme.goal;

    var head = (store.data.mode === 2)
      ? '<div class="cname ' + r.who + '">' + esc(r.name) + ' の ばん</div>' : '';

    app.innerHTML =
      head +
      roadHtml(r.steps) +
      '<div class="ask">じゃあ、その いっこまえは？' +
      '<small>「' + esc(last) + '」の まえに できていること' +
      '</small></div>' +
      '<div class="count">' + (run.step + 1) + ' / ' + game.STEPS + '</div>' +
      '<div class="hand" id="hand"></div>';

    var host = $('hand');
    hand.forEach(function (c) {
      var b = h('<button class="pick">' + esc(c.t) + '</button>');
      b.onclick = function () {
        if (b.classList.contains('chosen')) return;
        Array.prototype.forEach.call(host.querySelectorAll('.pick'), function (x) { x.disabled = true; });
        b.classList.add('chosen');
        buzz(12);
        setTimeout(function () { choose(c); }, 240);
      };
      host.appendChild(b);
    });
  }

  function choose(card) {
    var r = run.roads[run.idx];
    r.steps.push(card);
    run.step++;
    if (run.step < game.STEPS) { render(); root.scrollTo(0, 0); return; }
    /* この人の みちが できた */
    if (run.idx < run.roads.length - 1) {
      run.idx++; run.step = 0;
      setView('handoff');
    } else {
      run.rec = store.addRun(run.theme, run.roads);
      setView('compare');
    }
  }

  /* ============================================================
     みくらべ
     ============================================================ */
  function renderCompare() {
    var roads = run.roads, two = roads.length === 2;
    var same = two ? game.sameAt(roads[0], roads[1]) : [false, false, false];

    /* 段ごとに 横に ならべる。1つ目・2つ目…が 左右で そろっていないと 見くらべに ならない */
    var cells = roads.map(function (r) {
      return '<div class="cname ' + r.who + '">' + esc(r.name) + '</div>';
    });
    for (var st = 0; st < game.STEPS; st++) {
      roads.forEach(function (r) {
        var c = r.steps[st];
        cells.push('<div class="crung' + (same[st] ? ' same' : '') + '">' +
          '<span class="sz">' + szMark(c.s) + '　' + esc(IK.SIZE[c.s].short) + '</span>' +
          esc(c.t) + '</div>');
      });
    }

    /* ふたりの みちの かたちが おなじなら、おなじ文を 2回 出さない */
    var reads = roads.map(function (r) { return { r: r, s: game.shape(r.steps) }; });
    var merged = (reads.length === 2 && reads[0].s.key === reads[1].s.key);
    var shapes = (merged ? [reads[0]] : reads).map(function (x) {
      var who = merged ? 'ふたりとも' : x.r.name;
      return '<div class="shape"><span class="m">' + x.s.mark + '</span>' +
        '<div class="t">' + esc(who) + '：' + esc(x.s.title) + '</div>' +
        '<div class="b">' + esc(x.s.body) + '</div></div>';
    });

    var sameCount = same.filter(Boolean).length;

    app.innerHTML =
      '<div class="theme"><div class="em">' + esc(run.theme.emoji) + '</div>' +
      '<div class="lab">ゴール</div><div class="goal">' + esc(run.theme.goal) + '</div></div>' +
      '<div class="panel" style="margin-top:14px;padding-bottom:8px">' +
      '<div class="h">ふたりの みち　（上が ゴールに 近いほう）</div>' +
      (two && sameCount ? '<div class="samemark">おなじ カードを ' + sameCount + 'こ えらんだ ✨</div>' : '') +
      '<div class="compare' + (two ? '' : ' one') + '">' + cells.join('') + '</div>' +
      '</div>' +
      shapes.join('') +
      '<div class="panel" style="margin-top:14px">' +
      '<p class="sub">●が 多いほど <b>ゴールに 近い</b>、●が 少ないほど <b>いますぐ できる</b> こと。<br>' +
      'えらんでいる ときは 見えないようにして あります。<br><br>' +
      '<b>おたがいに 聞いてみよう：「なんで それを えらんだの？」</b></p>' +
      '</div>' +
      '<button class="big" id="tonext">きょう やる ことを きめる</button>';

    $('tonext').onclick = function () { setView('todo'); };
  }

  /* ============================================================
     きょう やる ことを 1つ
     ============================================================ */
  function renderTodo() {
    var cands = game.todoCandidates(run.roads);
    app.innerHTML =
      '<div class="rung goal"><span class="n">⭐</span>' + esc(run.theme.goal) + '</div>' +
      '<div class="ask">きょう やるのは どれ？' +
      '<small>1つだけ えらぶ。●が 少ないほど すぐ できる</small></div>' +
      '<div class="hand" id="hand"></div>';

    var host = $('hand');
    cands.forEach(function (c) {
      var who = store.data.mode === 2 ? '<span style="color:var(--dim);font-size:11.5px">（' + esc(store.nameOf(c.who)) + '）</span> ' : '';
      var b = h('<button class="pick"><span style="color:var(--dim);font-size:11px;letter-spacing:.16em">' +
        szMark(c.s) + '</span><br>' + who + esc(c.t) + '</button>');
      b.onclick = function () {
        Array.prototype.forEach.call(host.querySelectorAll('.pick'), function (x) { x.disabled = true; });
        b.classList.add('chosen');
        buzz([8, 30, 14]);
        store.setTodo(run.rec, c, c.who);
        run.todo = c;
        setTimeout(function () { setView('finish'); }, 260);
      };
      host.appendChild(b);
    });
  }

  /* ============================================================
     しあげ
     ============================================================ */
  function renderFinish() {
    var c = run.todo;
    app.innerHTML =
      '<div class="finish"><div class="em">🎉</div><div class="t">みちが できた！</div></div>' +
      '<div class="promise" style="margin-top:10px">' +
      '<div class="lab">きょう やること</div>' +
      '<div class="t">' + esc(c.t) + '</div>' +
      '<div class="by">ゴール：' + esc(run.theme.goal) + '</div>' +
      '</div>' +
      '<div class="panel" style="margin-top:14px">' +
      '<p class="sub">つぎに ひらいたとき、<b>「やった？」</b> と 聞きます。<br>' +
      '🔥は 道を 作った日ではなく、<b>じっさいに やった日</b> だけ のびます。</p>' +
      '</div>' +
      '<button class="big" id="fin">おわり</button>';
    $('fin').onclick = function () { run = null; hidePromise = false; setView('home'); };
  }

  /* ============================================================
     きろく
     ============================================================ */
  function renderLog() {
    var d = store.data, s = d.streak;
    var out = [
      '<div class="stats">' +
      '<div class="stat"><b>' + d.counts.runs + '</b><span>つくった みち</span></div>' +
      '<div class="stat"><b>' + d.counts.dones + '</b><span>やった こと</span></div>' +
      '<div class="stat"><b>' + (store.streakAlive() ? s.days : 0) + '</b><span>つづいた日（さいこう ' + s.best + '）</span></div>' +
      '</div>'
    ];

    if (!d.runs.length) {
      out.push('<div class="panel" style="margin-top:14px"><p class="sub">まだ 何も ありません。<br>「あそぶ」から はじめてみてください。</p></div>');
    } else {
      out.push('<div class="h" style="margin:20px 0 10px">つくった みち</div>');
      d.runs.slice(0, 60).forEach(function (r) {
        var lines = r.roads.map(function (rd) {
          return '<div style="margin-top:8px"><span style="font-size:11.5px;font-weight:800;color:var(--' + rd.who + ')">' +
            esc(rd.name) + '</span><br><span style="font-size:13px;color:var(--muted);line-height:1.7">' +
            rd.steps.map(function (c) { return esc(c.t); }).join(' <span style="color:var(--dim)">←</span> ') +
            '</span></div>';
        }).join('');
        var todo = '';
        if (r.todo) {
          todo = '<div class="todo' + (r.done ? ' ok' : '') + '">' +
            (r.done ? '✅ やった（' + esc(r.doneAt) + '）：' : '🎯 きめた こと：') + esc(r.todo.t) + '</div>';
        }
        out.push(
          '<div class="logitem">' +
          '<div class="top"><span class="em">' + esc(r.emoji || '🎯') + '</span>' +
          '<span class="g">' + esc(r.goal) + '</span>' +
          '<span class="d">' + esc(r.at) + '</span></div>' +
          lines + todo +
          '</div>'
        );
      });
    }
    app.innerHTML = out.join('');
  }

  /* ============================================================
     せってい
     ============================================================ */
  function renderSettings() {
    app.innerHTML =
      '<div class="panel">' +
      '<div class="h">なまえ</div>' +
      '<div class="field"><label>こども</label><input id="n-kid" maxlength="8" value="' + esc(store.nameOf('kid')) + '"></div>' +
      '<div class="field"><label>おとな</label><input id="n-adult" maxlength="8" value="' + esc(store.nameOf('adult')) + '"></div>' +
      '<p class="sub">画面に 出る よび名です。この 端末の 中だけに 入ります。</p>' +
      '</div>' +

      '<div class="panel">' +
      '<div class="h">このアプリの こと</div>' +
      '<p class="sub">おだいは ' + IK.THEMES.length + 'こ 入っています。まだ やっていない ものから 日がわりで 出ます。<br><br>' +
      '正かいは ありません。どの カードを えらんでも みちに なります。<br>' +
      'カードには「ゴールに どれくらい 近いか」の 高さが かくれていて、えらび終わってから 見えます。</p>' +
      '</div>' +

      '<div class="panel">' +
      '<div class="h">きろくの もちだし</div>' +
      '<p class="sub">きろくは この端末の ブラウザの中だけに あります。どこにも 送っていません。<br>' +
      '別の 端末に うつすときは、下の 文を コピーして はりつけてください。</p>' +
      '<textarea class="io" id="io" spellcheck="false">' + esc(store.exportText()) + '</textarea>' +
      '<div class="row" style="margin-top:10px">' +
      '<button class="mini" id="copy">コピーする</button>' +
      '<button class="mini" id="load">はりつけた 文を よみこむ</button>' +
      '</div>' +
      '</div>' +

      '<div class="panel">' +
      '<div class="h">けす</div>' +
      '<button class="mini danger" id="reset" style="width:100%">きろくを ぜんぶ けす</button>' +
      '</div>';

    $('n-kid').onchange = function () { store.setName('kid', this.value); toast('なまえを かえました'); };
    $('n-adult').onchange = function () { store.setName('adult', this.value); toast('なまえを かえました'); };

    $('copy').onclick = function () {
      var ta = $('io');
      ta.select();
      try {
        if (navigator.clipboard) navigator.clipboard.writeText(ta.value);
        else document.execCommand('copy');
        toast('コピーしました');
      } catch (e) { toast('えらべる 状態に しました'); }
    };
    $('load').onclick = function () {
      try {
        store.importText($('io').value);
        toast('よみこみました');
        renderHud(); render();
      } catch (e) { toast('よみこめませんでした'); }
    };
    $('reset').onclick = function () {
      if (!root.confirm('きろくを ぜんぶ けします。もどせません。いいですか？')) return;
      store.reset(); themeN = 0; hidePromise = false;
      renderHud(); setView('home');
      toast('けしました');
    };
  }

  /* ============================================================
     ふりわけ
     ============================================================ */
  function render() {
    if (view === 'play' && !run) view = 'home';
    if (view === 'handoff' && !run) view = 'home';
    if ((view === 'compare' || view === 'todo' || view === 'finish') && !run) view = 'home';

    if (view === 'home') renderHome();
    else if (view === 'handoff') renderHandoff();
    else if (view === 'play') renderPlay();
    else if (view === 'compare') renderCompare();
    else if (view === 'todo') renderTodo();
    else if (view === 'finish') renderFinish();
    else if (view === 'log') renderLog();
    else if (view === 'settings') renderSettings();
    renderHud();
  }

  /* ============================================================
     たちあげ
     ============================================================ */
  function boot() {
    app = $('app');
    store.load();

    Array.prototype.forEach.call(document.querySelectorAll('#tabbar button'), function (b) {
      b.onclick = function () {
        if (run && b.dataset.view !== view) {
          if (!root.confirm('とちゅうです。やめて いいですか？')) return;
          run = null;
        }
        setView(b.dataset.view);
      };
    });
    $('hud-quit').onclick = function () {
      if (!root.confirm('とちゅうです。やめて いいですか？')) return;
      quitRun();
    };

    setView('home');
  }
