<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131a26">
<meta name="description" content="ゴールから「じゃあ、いっこまえは？」を3回くりかえして、今日やる一歩まで降りる。親子で別々に道を作って、あとで見せ合うアプリ。">
<title>いっこまえ — ゴールから ぎゃくに、きょうの 一歩まで</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.svg">
<link rel="apple-touch-icon" href="assets/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

<header class="appbar">
  <div class="appbar-in">
    <div class="logo">いっこ<b>まえ</b></div>
    <div class="spacer"></div>
    <div id="hud-fire" class="off">🔥<b>0</b></div>
    <button class="iconbtn" id="hud-quit" title="やめる" style="display:none">✕</button>
  </div>
</header>

<main id="app" class="main"></main>

<nav class="tabbar">
  <div class="tabbar-in" id="tabbar">
    <button data-view="home"><span class="i">🪜</span>あそぶ</button>
    <button data-view="log"><span class="i">📒</span>きろく</button>
    <button data-view="settings"><span class="i">⚙️</span>せってい</button>
  </div>
</nav>

<script src="assets/themes.js"></script>
<script src="assets/store.js"></script>
<script src="assets/game.js"></script>
<script src="assets/app.js"></script>

</html>
